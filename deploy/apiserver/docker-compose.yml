services:
  nats:
    image: nats:2-alpine
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1:4222"]
      interval: 5s
      timeout: 1s
      retries: 1
      start_period: 2s
      start_interval: 2s
    command:
      - "-js"
      - "--store_dir"
      - "/data"
    ports:
      - 4222:4222
    volumes:
      - nats:/data

  wash-host:
    image: ghcr.io/wasmcloud/wash:canary
    restart: always
    command: host --scheduler-nats-url nats://nats:4222 --data-nats-url nats://nats:4222 --http-addr 0.0.0.0:8080 --host-group default --host-name wash-host
    depends_on:
      nats:
        condition: service_healthy
    ports:
      # Exposes any HTTP-triggered workload placed on this host directly,
      # for local testing. There's no gateway in this deployment to route
      # by workload, so this only makes sense with a single wash-host.
      - 8081:8080

  apiserver:
    build: ../../runtime-apiserver
    restart: always
    command:
      - "-nats-url=nats://nats:4222"
    depends_on:
      nats:
        condition: service_healthy
    ports:
      - 8080:8080

volumes:
  nats: {}
